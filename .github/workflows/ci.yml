name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-soup-3.0 libglib2.0-dev-bin python3
      - name: Verify JavaScript, schemas, fixtures, and package
        run: npm run verify
      - name: Stress history, notifications, and subprocess bounds
        run: npm run test:stress
      - name: Verify packaged schemas
        run: |
          unzip dist/*.zip -d "$RUNNER_TEMP/usagebeam-install"
          test -f "$RUNNER_TEMP/usagebeam-install/schemas/gschemas.compiled"
          GSETTINGS_SCHEMA_DIR="$RUNNER_TEMP/usagebeam-install/schemas" gsettings list-keys org.gnome.shell.extensions.usagebeam
      - uses: actions/upload-artifact@v7
        with:
          name: usagebeam-extension
          path: dist/*.zip
